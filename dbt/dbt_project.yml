name: lumora
version: "1.0.0"
config-version: 2
profile: lumora

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Analysis window for the month spine (end is exclusive)
  start_month: "2023-01-01"
  end_month: "2026-01-01"

models:
  lumora:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
